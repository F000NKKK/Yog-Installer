# Builds Yog Installer for Linux, Windows and macOS and attaches the packages
# — and the catalog, the channel installers already out there refresh from —
# to the release of the pushed tag (v0.1.0, …). Yog-Mod-Loader is checked
# out next to it in `yog/`, Substrate-Platform beside `yog/`, as on a
# developer's machine.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The release first, once: every build then uploads into it. Builds that
  # each looked for it and created their own made two releases of one tag.
  release:
    runs-on: ubuntu-22.04
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${{ github.ref_name }}" -R "${{ github.repository }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" -R "${{ github.repository }}" --title "Yog Installer ${{ github.ref_name }}" --notes "Yog Installer — installs and updates Yog IDLE, the Yog CLI, the loader SDK, JDKs and the Rust toolchain. Download the package for your system below."

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      # The Yog repositories in `yog/`, Substrate-Platform beside it: the
      # layout the Installer's `../` and `../../` paths name.
      - uses: actions/checkout@v4
        with:
          path: yog/Yog-Installer
      - uses: actions/checkout@v4
        with:
          repository: F000NKKK/Substrate-Platform
          path: Substrate-Platform
      - uses: actions/checkout@v4
        with:
          repository: F000NKKK/Yog-Mod-Loader
          path: yog/Yog-Mod-Loader

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust (the toolchain rust-toolchain.toml pins)
        working-directory: yog/Yog-Installer
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          if [ "$RUNNER_OS" = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi

      - name: Substrate's UI packages
        working-directory: Substrate-Platform/ui
        run: npm ci

      - name: Yog Installer's packages
        working-directory: yog/Yog-Installer
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: yog/Yog-Installer
          tagName: ${{ github.ref_name }}
          releaseName: "Yog Installer ${{ github.ref_name }}"
          releaseBody: "Yog Installer — installs and updates Yog IDLE, the Yog CLI, the loader SDK, JDKs and the Rust toolchain. Download the package for your system below."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  catalog:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: The channel's catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" catalog/catalog.toml --clobber
