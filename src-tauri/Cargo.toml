[package]
name = "yog-installer"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
description = "Yog Installer — installs and updates Yog IDLE, the Yog CLI, the loader SDK, JDKs and the Rust toolchain."

[lib]
name = "yog_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
substrate-host-contract = { workspace = true }
yog-codegen = { workspace = true }
yog-codegen-typescript = { workspace = true }
tauri-build = { version = "2", features = [] }

[dependencies]
yog-installer-core = { workspace = true }
yog-home = { workspace = true }
# The pending journal.
yog-data = { workspace = true }
substrate-data = { workspace = true }
yog-ids = { workspace = true }
substrate-lock = { workspace = true }
substrate-workspace-domain = { workspace = true }
substrate-workspace-fs = { workspace = true }
substrate-state-json = { workspace = true }
substrate-project-domain = { workspace = true }
substrate-host-contract = { workspace = true }
substrate-process = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-substrate = { workspace = true }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
