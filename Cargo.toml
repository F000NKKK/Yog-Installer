[workspace]
resolver = "2"
members = ["crates/yog-installer-core", "src-tauri"]

[workspace.package]
version = "1.4.1"
edition = "2024"
rust-version = "1.99"
authors = ["F000NK"]
license = "AGPL-3.0-only"
repository = "https://github.com/F000NKKK/Yog-Installer"

[workspace.dependencies]
yog-installer-core = { path = "crates/yog-installer-core" }
# Starting programs with the system's environment (not this AppImage's), from the platform.
substrate-lock = "0.1.0"
substrate-workspace-domain = "0.1.0"
substrate-workspace-fs = "0.1.0"
substrate-state-json = "0.1.0"
substrate-project-domain = "0.1.0"
tauri-plugin-substrate = "0.1.0"
# Substrate's split crates: processes, the host contract (commands, events).
substrate-process = "0.1.0"
substrate-host-contract = "0.1.0"
# Yog's home: what's installed (components.ydata) and where things go.
yog-home = "0.6.1"
yog-ids = "0.6.3"
# The generated files' header, as TypeScript.
yog-codegen = "0.1.0"
yog-codegen-typescript = "0.1.0"
# The Installer's own files, binary Yog Data.
yog-data = "0.10.2"
# What `#[derive(Schema)]` expands to.
substrate-data = "0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# HTTPS for releases and downloads (rustls: no system OpenSSL).
ureq = { version = "3.5", features = ["json"] }
semver = "1"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
# xz (zig's archives) streamed in pure Rust: no C to build on any platform.
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz"] }
dirs = "7"
libc = "0.2"

# Yog's crates from the sibling checkout, as Yog-IDLE does.
[patch.crates-io]
# Substrate-Platform's crates from the sibling checkout while they go out
# on crates.io (a new crate every ~10 minutes); dropped once all are.
substrate-message = { path = "../../Substrate-Platform/crates/substrate-message" }
substrate-dap-domain = { path = "../../Substrate-Platform/crates/substrate-dap-domain" }
substrate-framing = { path = "../../Substrate-Platform/crates/substrate-framing" }
substrate-lock = { path = "../../Substrate-Platform/crates/substrate-lock" }
substrate-run-domain = { path = "../../Substrate-Platform/crates/substrate-run-domain" }
substrate-run-app = { path = "../../Substrate-Platform/crates/substrate-run-app" }
substrate-dap-app = { path = "../../Substrate-Platform/crates/substrate-dap-app" }
substrate-dap-toml = { path = "../../Substrate-Platform/crates/substrate-dap-toml" }
substrate-git-domain = { path = "../../Substrate-Platform/crates/substrate-git-domain" }
substrate-git-app = { path = "../../Substrate-Platform/crates/substrate-git-app" }
substrate-process = { path = "../../Substrate-Platform/crates/substrate-process" }
substrate-workspace-domain = { path = "../../Substrate-Platform/crates/substrate-workspace-domain" }
substrate-git-gitcli = { path = "../../Substrate-Platform/crates/substrate-git-gitcli" }
substrate-lsp-domain = { path = "../../Substrate-Platform/crates/substrate-lsp-domain" }
substrate-project-domain = { path = "../../Substrate-Platform/crates/substrate-project-domain" }
substrate-search-domain = { path = "../../Substrate-Platform/crates/substrate-search-domain" }
substrate-state-json = { path = "../../Substrate-Platform/crates/substrate-state-json" }
substrate-terminal-domain = { path = "../../Substrate-Platform/crates/substrate-terminal-domain" }
substrate-workspace-app = { path = "../../Substrate-Platform/crates/substrate-workspace-app" }
substrate-workspace-fs = { path = "../../Substrate-Platform/crates/substrate-workspace-fs" }
substrate-host-contract = { path = "../../Substrate-Platform/crates/substrate-host-contract" }
substrate-lsp-app = { path = "../../Substrate-Platform/crates/substrate-lsp-app" }
substrate-lsp-toml = { path = "../../Substrate-Platform/crates/substrate-lsp-toml" }
substrate-project-app = { path = "../../Substrate-Platform/crates/substrate-project-app" }
substrate-project-toml = { path = "../../Substrate-Platform/crates/substrate-project-toml" }
substrate-run-process = { path = "../../Substrate-Platform/crates/substrate-run-process" }
substrate-run-toml = { path = "../../Substrate-Platform/crates/substrate-run-toml" }
substrate-search-app = { path = "../../Substrate-Platform/crates/substrate-search-app" }
substrate-search-ignore = { path = "../../Substrate-Platform/crates/substrate-search-ignore" }
substrate-terminal-app = { path = "../../Substrate-Platform/crates/substrate-terminal-app" }
substrate-terminal-pty = { path = "../../Substrate-Platform/crates/substrate-terminal-pty" }
tauri-plugin-substrate = { path = "../../Substrate-Platform/tauri-plugin" }
yog-codegen = { path = "../Yog-Mod-Loader/rust/crates/yog-codegen" }
yog-codegen-typescript = { path = "../Yog-Mod-Loader/rust/crates/yog-codegen-typescript" }
yog-home = { path = "../Yog-Mod-Loader/rust/crates/yog-home" }
yog-ids = { path = "../Yog-Mod-Loader/rust/crates/yog-ids" }
yog-data = { path = "../Yog-Mod-Loader/rust/crates/yog-data" }
