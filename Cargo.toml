[workspace]
resolver = "2"
members = ["crates/yog-installer-core", "src-tauri"]

[workspace.package]
version = "1.3.4"
edition = "2024"
rust-version = "1.99"
authors = ["F000NK"]
license = "AGPL-3.0-only"
repository = "https://github.com/F000NKKK/Yog-Installer"

[workspace.dependencies]
yog-installer-core = { path = "crates/yog-installer-core" }
# Starting programs with the system's environment (not this AppImage's), from the platform.
substrate-platform = { path = "../Substrate-Platform" }
tauri-plugin-substrate = { path = "../Substrate-Platform/tauri-plugin" }
# Yog's home: what's installed (components.ydata) and where things go.
yog-home = "0.6.1"
yog-ids = "0.6.3"
# The generated files' header, as TypeScript.
yog-codegen = "0.1.0"
yog-codegen-typescript = "0.1.0"
# The Installer's own files, binary Yog Data.
yog-data = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# HTTPS for releases and downloads (rustls: no system OpenSSL).
ureq = { version = "3", features = ["json"] }
semver = "1"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
# xz (zig's archives) streamed in pure Rust: no C to build on any platform.
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz"] }
dirs = "7"
libc = "0.2"

# Yog's crates from the sibling checkout, as Yog-IDLE does.
[patch.crates-io]
yog-codegen = { path = "../Yog-Mod-Loader/rust/crates/yog-codegen" }
yog-codegen-typescript = { path = "../Yog-Mod-Loader/rust/crates/yog-codegen-typescript" }
yog-home = { path = "../Yog-Mod-Loader/rust/crates/yog-home" }
yog-ids = { path = "../Yog-Mod-Loader/rust/crates/yog-ids" }
yog-data = { path = "../Yog-Mod-Loader/rust/crates/yog-data" }
yog-data-derive = { path = "../Yog-Mod-Loader/rust/crates/yog-data-derive" }
